<title>Paris Experience Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Baloo+2:wght@600;700;800&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Camila OS design language (pastel tokens, Baloo 2 + Montserrat, side rail, tinted stat tiles) with a Paris editorial layer: serif italic accents, champagne gold, photo-led cards. */
:root{
  --bg:#f5f6fb; --panel:#ffffff; --panel2:#f7f8fc; --panel3:#eef0f7;
  --ink:#1f2333; --ink-soft:#6b7087; --line:#e8eaf2; --line2:#dfe2ee;
  --accent:#e0718a; --accent-soft:#ffe3ea; --accent-ink:#b4486a;
  --ok:#3f9a6a; --ok-bg:#dff3e7; --warn:#a96f0f; --warn-bg:#fff1c9;
  --bad:#d24a4a; --bad-bg:#fde3e3; --me:#c2529a; --me-bg:#fbe1f0;
  --idle:#757a90; --idle-bg:#eef0f6; --done:#3d86be; --done-bg:#ddeefb;
  --champ:#b8872e; --champ-bg:#f8edd2;
  --rosa:#ffd9e1; --rosa-ink:#b4486a; --azul:#d7ecfb; --azul-ink:#2f6f9e; --amarelo:#fff0b3; --amarelo-ink:#8a6410;
  --lilas:#e7e0fb; --lilas-ink:#5f4aa6; --verde:#d9f2e3; --verde-ink:#2c7a50; --laranja:#ffe3cf; --laranja-ink:#a8561f; --menta:#d6f2ee; --menta-ink:#2b7a6e;
  --shadow:0 8px 26px rgba(63,68,100,.10); --shadow2:0 2px 8px rgba(63,68,100,.07);
  --r:20px; --r2:14px;
  --f-display:"Baloo 2","Montserrat",system-ui,sans-serif; --f-body:"Montserrat",system-ui,sans-serif; --f-serif:"Instrument Serif",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15182a; --panel:#1e2236; --panel2:#181c2e; --panel3:#262b42; --ink:#eceef8; --ink-soft:#a1a6bd; --line:#2c3148; --line2:#363c56;
  --accent:#e889a0; --accent-soft:#3e2a37; --accent-ink:#f3b7c7; --ok:#6fc296; --ok-bg:#1f3a2d; --warn:#e0b25a; --warn-bg:#3d331a;
  --bad:#ef8484; --bad-bg:#432628; --me:#df8fc4; --me-bg:#412a3a; --idle:#a1a6bd; --idle-bg:#262b42; --done:#86bfe8; --done-bg:#1f3346;
  --champ:#e0b457; --champ-bg:#3a2f16;
  --rosa:#4a2b36; --rosa-ink:#f3b7c7; --azul:#1f3346; --azul-ink:#9fd0f3; --amarelo:#423a1c; --amarelo-ink:#f0d383;
  --lilas:#2f2a4a; --lilas-ink:#c6b8f4; --verde:#1f3a2d; --verde-ink:#9fe0bd; --laranja:#44301f; --laranja-ink:#f3bd93; --menta:#1d3b38; --menta-ink:#95dfd3;
  --shadow:0 8px 26px rgba(0,0,0,.4); --shadow2:0 2px 8px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15182a; --panel:#1e2236; --panel2:#181c2e; --panel3:#262b42; --ink:#eceef8; --ink-soft:#a1a6bd; --line:#2c3148; --line2:#363c56;
  --accent:#e889a0; --accent-soft:#3e2a37; --accent-ink:#f3b7c7; --ok:#6fc296; --ok-bg:#1f3a2d; --warn:#e0b25a; --warn-bg:#3d331a;
  --bad:#ef8484; --bad-bg:#432628; --me:#df8fc4; --me-bg:#412a3a; --idle:#a1a6bd; --idle-bg:#262b42; --done:#86bfe8; --done-bg:#1f3346;
  --champ:#e0b457; --champ-bg:#3a2f16;
  --rosa:#4a2b36; --rosa-ink:#f3b7c7; --azul:#1f3346; --azul-ink:#9fd0f3; --amarelo:#423a1c; --amarelo-ink:#f0d383;
  --lilas:#2f2a4a; --lilas-ink:#c6b8f4; --verde:#1f3a2d; --verde-ink:#9fe0bd; --laranja:#44301f; --laranja-ink:#f3bd93; --menta:#1d3b38; --menta-ink:#95dfd3;
  --shadow:0 8px 26px rgba(0,0,0,.4); --shadow2:0 2px 8px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);padding-block:0;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:800;letter-spacing:-.005em;margin:0;text-wrap:balance}
a{color:var(--accent-ink)}
.mut{color:var(--ink-soft)}.small{font-size:12px}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:92px minmax(0,1fr);min-height:100svh}
.side{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;background:var(--panel);border-right:1.5px solid var(--line);overflow-y:auto}
.brand{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font:italic 400 28px/1 var(--f-serif);background:linear-gradient(135deg,var(--rosa),var(--lilas));color:var(--rosa-ink);margin-bottom:8px;box-shadow:var(--shadow2);flex:none}
.tabs{display:flex;flex-direction:column;gap:4px;width:100%}
.tabs button{position:relative;width:100%;border:0;background:transparent;border-radius:16px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 10.5px/1.1 var(--f-body);color:var(--ink-soft);min-height:54px;transition:background .15s,color .15s}
.tabs .em{font-size:20px;line-height:1.1}
.tabs button:hover{background:var(--panel2);color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
.tabs .n{position:absolute;top:2px;right:6px;min-width:18px;padding:0 5px;border-radius:99px;background:var(--me);color:#fff;font-size:10.5px;line-height:18px;text-align:center}
.main{min-width:0;padding:16px 22px 40px}
.wrap{max-width:1280px;margin:0 auto}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:2px 0 14px}
.logo h1{font-size:27px;line-height:1.1}
.logo .os{font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase}
.topright{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle)}.dot.on{background:var(--ok)}.dot.bad{background:var(--bad)}
.btn{font-weight:700;border:1.5px solid var(--ink);background:var(--ink);color:var(--panel);border-radius:99px;padding:8px 15px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;min-height:36px;text-decoration:none;transition:transform .12s,box-shadow .12s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.gh{background:var(--panel);color:var(--ink);border-color:var(--line2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--panel);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:12px;min-height:30px}.btn:disabled{opacity:.45;cursor:default}
.bell{position:relative}.bell .n{position:absolute;top:-6px;right:-4px;min-width:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:10.5px;line-height:18px;text-align:center}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow2);padding:14px 16px;min-width:0}
.view{display:grid;gap:16px}
.sec{font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);margin:0 0 8px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pagehead h2{font-size:24px}.pagehead .lead{margin:2px 0 0;color:var(--ink-soft);font-size:13px;max-width:70ch}
.serif{font-family:var(--f-serif);font-style:italic;font-weight:400}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 24px;background:linear-gradient(120deg,var(--rosa) 0%,var(--lilas) 58%,var(--azul) 100%);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:center;box-shadow:var(--shadow)}
.hero .eyebrow{font:700 11px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.hero h2{font-size:42px;line-height:1.02;margin:6px 0 8px;font-weight:800;color:var(--ink)}
.hero h2 .serif{font-size:1.18em;color:var(--accent-ink)}
.hero p{margin:0;max-width:46ch;color:var(--ink)}
.hero .hrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mosaic{display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:1fr 1fr;gap:8px;height:210px}
.mosaic .ph:first-child{grid-row:1/3}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding:18px}.hero h2{font-size:32px}.mosaic{height:150px}}
/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:1180px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{text-align:left;border:0;border-radius:var(--r);padding:12px 14px 10px;min-height:104px;display:flex;flex-direction:column;gap:2px;background:var(--sc,var(--panel3));color:var(--ink);box-shadow:var(--shadow2);transition:transform .15s,box-shadow .15s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat .sic{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:15px;margin-bottom:4px}
:root[data-theme="dark"] .stat .sic{background:rgba(255,255,255,.1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stat .sic{background:rgba(255,255,255,.1)}}
.stat .num{font:800 30px/1 var(--f-display);color:var(--si,var(--ink));font-variant-numeric:tabular-nums}
.stat .lab{font-size:12.5px;font-weight:700;margin-top:2px}.stat .sub{font-size:11px;color:var(--ink-soft);line-height:1.3}
/* photos */
.ph{position:relative;overflow:hidden;border-radius:14px;background:var(--t,var(--panel3));min-height:0;aspect-ratio:16/10}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .phf{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ti,var(--ink-soft))}
.ph .phf span{font-size:38px;line-height:1}.ph .phf small{font:700 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase}
.ph.sq{aspect-ratio:1/1}.ph.wide{aspect-ratio:21/9}
.ph .ov{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
.ph .sc{position:absolute;top:8px;right:8px}
.chipo{background:rgba(255,255,255,.92);color:#1f2333;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700}
.score{font:800 15px var(--f-display);min-width:40px;text-align:center;border-radius:12px;padding:3px 8px;background:rgba(255,255,255,.95);color:#b4486a;font-variant-numeric:tabular-nums}
/* tags */
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--idle-bg);color:var(--idle)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.acc{background:var(--accent-soft);color:var(--accent-ink)}.tag.gold{background:var(--champ-bg);color:var(--champ)}.tag.azul{background:var(--azul);color:var(--azul-ink)}
.vd{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700}.vd i{width:10px;height:10px;border-radius:50%;background:var(--idle)}.vd.green i{background:var(--ok)}.vd.yellow i{background:#e0a800}.vd.red i{background:var(--bad)}
/* filters */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:700;min-height:34px;transition:background .15s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}.chip .n{opacity:.7;font-variant-numeric:tabular-nums}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fbar select,.fbar input,.tx{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:7px 12px;min-height:38px;min-width:0;max-width:100%}
.fbar input[type=search]{flex:1 1 220px;border-radius:99px}
details.more>summary{cursor:pointer;font-weight:700;font-size:12.5px;color:var(--ink-soft);list-style:none}
details.more[open]>summary{margin-bottom:8px}
/* opp cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.opp{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow2);padding:10px;display:grid;gap:10px;align-content:start;min-width:0;transition:transform .15s,box-shadow .15s;animation:rise .25s ease both}
.opp:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.opp.pri{border-color:var(--champ)}
.opp .ob{padding:0 6px 4px;display:grid;gap:8px}
.opp h3{font-size:18px;line-height:1.15;overflow-wrap:anywhere;cursor:pointer}
.opp .ex{font-size:13px;color:var(--ink-soft)}
.dots{display:flex;gap:3px;align-items:center}.dots i{height:5px;flex:1;border-radius:3px;background:var(--panel3)}.dots i.on{background:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;font-size:12.5px;margin:0}
.facts dt{font:700 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}.facts dd{margin:1px 0 0;font-weight:600;overflow-wrap:anywhere}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.chk{width:22px;height:22px;accent-color:var(--ok)}
.msg{border:1.5px solid var(--line2);border-radius:14px;background:var(--panel2);padding:10px 12px}
.msg pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0;font:inherit}
.msg .hd{font:700 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}.msg.pt{border-style:dashed}
.int{border:1.5px dashed var(--warn);background:var(--warn-bg);border-radius:14px;padding:10px 12px;font-size:13px}
.note{border-radius:14px;padding:10px 14px;font-size:13px;background:var(--accent-soft)}.note.warn{background:var(--warn-bg)}.note.bad{background:var(--bad-bg)}
/* scrollers, pipeline */
.scroller{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,250px);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.scroller>*{scroll-snap-align:start}
.mini{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:8px;display:grid;gap:6px;cursor:pointer;box-shadow:var(--shadow2);transition:transform .15s}.mini:hover{transform:translateY(-2px)}
.mini b{font:800 15px/1.2 var(--f-display);padding:0 4px}.mini span{padding:0 4px;font-size:12px;color:var(--ink-soft)}
.pipe{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(236px,1fr);gap:12px;overflow-x:auto;align-items:start;padding-bottom:8px}
.col{background:var(--panel2);border:1.5px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.col h4{font:800 14px var(--f-display);display:flex;justify-content:space-between;align-items:center}
.col h4 em{font:700 12px var(--f-body);font-style:normal;background:var(--panel);border-radius:99px;padding:1px 9px}
.pc{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;align-items:center;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:6px;cursor:pointer;transition:transform .15s}.pc:hover{transform:translateY(-1px)}
.pc .ph{aspect-ratio:1/1;border-radius:10px}.pc b{font-size:13px;line-height:1.2;display:block;overflow-wrap:anywhere}.pc span{font-size:11.5px;color:var(--ink-soft)}
.ptrack{display:flex;gap:6px;flex-wrap:wrap}
.ptrack button{flex:1 1 90px;border:0;border-radius:14px;padding:8px 10px;background:var(--panel);box-shadow:var(--shadow2);text-align:left}
.ptrack b{display:block;font:800 22px/1 var(--f-display)}.ptrack span{font-size:11px;color:var(--ink-soft);font-weight:700}
/* planner */
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:980px){.days{grid-template-columns:1fr}}
.day{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;align-content:start}
.day h3{font-size:20px}.day .win{font-size:12px;color:var(--ink-soft)}
.occ{height:8px;border-radius:5px;background:var(--panel3);overflow:hidden}.occ i{display:block;height:100%;background:var(--ok)}
.slot{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;border:1.5px solid var(--line);border-radius:16px;padding:8px;background:var(--panel2)}
.slot .ph{aspect-ratio:1/1;border-radius:12px}
.slot.bad{border-color:var(--bad)}
.gap{border:1.5px dashed var(--line2);border-radius:12px;padding:6px 10px;font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px}
.maybe{border:1.5px dashed var(--champ);border-radius:14px;padding:8px 10px;font-size:12.5px;background:var(--champ-bg)}
/* neg */
.neg{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow2)}
@media (max-width:640px){.neg{grid-template-columns:1fr}}
/* drawer */
.sheet{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end}.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(20,22,36,.5);backdrop-filter:blur(2px)}
.panel{position:relative;background:var(--bg);width:min(700px,100%);height:100%;overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));box-shadow:var(--shadow);border-radius:24px 0 0 24px;animation:slide .22s ease both}
@media (max-width:720px){.panel{margin-top:6%;height:94%;border-radius:22px 22px 0 0;align-self:flex-end}.sheet{align-items:flex-end}}
.pb{display:flex;gap:8px;position:sticky;top:-14px;background:var(--bg);padding:6px 0;z-index:2;margin-bottom:6px}
.gal{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(78%,1fr);gap:8px;overflow-x:auto;scroll-snap-type:x mandatory}.gal>*{scroll-snap-align:start}
.dtabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1.5px solid var(--line);margin-top:12px}
.dtabs button{border:0;background:none;padding:9px 12px;font-weight:700;color:var(--ink-soft);border-bottom:3px solid transparent;white-space:nowrap}
.dtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.dsec{margin-top:14px;display:grid;gap:10px}
.actbar{position:sticky;bottom:calc(-1 * env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0 2px;margin-top:14px;border-top:1.5px solid var(--line);z-index:2}
label.f{display:grid;gap:3px;font-size:12px;font-weight:700;margin-top:10px}
.sbar{display:grid;grid-template-columns:130px 1fr 24px;gap:8px;align-items:center;font-size:12px}.sbar .t{background:var(--panel3);height:8px;border-radius:5px;overflow:hidden}.sbar .t i{display:block;height:100%;background:var(--champ)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th{font:700 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line)}td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.empty{padding:28px 14px;text-align:center;color:var(--ink-soft)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 18px;border-radius:99px;font-size:13px;z-index:90;display:none;max-width:90vw;box-shadow:var(--shadow)}.toast.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

<script>
(function(){
"use strict";
var TZ="America/Toronto";
var COLS=["ph_experiences","ph_companies","ph_opps","ph_contacts","ph_commands","ph_activity","ph_itinerary","ph_meta"];
var S={},LOADED={},DB=null,MCP=null,TAB="inicio";
var F={lang:"",role:"",prem:"",orig:"",view:"decisao",q:"",cat:"",prio:"",area:"",slot:"",stage:"",rel:"",chan:"",apt:"",sort:"score"};
var SEL={};
var CAT={seine:"Sena",bus:"Ônibus e experiências móveis",restaurant:"Restaurante",immersive:"Imersivo e cultural",workshop:"Workshop",tea_cafe:"Chá e café",night:"Noite",wellness:"Bem-estar",photoshoot:"Ensaio fotográfico",tour:"Tour guiado",other:"Outros"};
var STAGES=[["descoberta","Descoberta"],["qualificacao","Qualificação"],["pronta","Pronta para contato"],["contatada","Contatada"],["aguardando","Aguardando resposta"],["followup","Follow-up"],["respondeu","Resposta recebida"],["negociacao","Negociação"],["proposta","Proposta recebida"],["aguardando_aprovacao","Aguardando minha aprovação"],["aprovada","Aprovada"],["confirmada","Confirmada"],["recusada","Recusada"],["encerrada","Encerrada"]];
var STN={};STAGES.forEach(function(s){STN[s[0]]=s[1]});
var VER={green:"Verificada",yellow:"Verificação incompleta",red:"Suspeita",white:"Não verificada"};
var CH={email:"E-mail",instagram:"DM Instagram (manual)",form:"Formulário (manual)"};
var SLOTS={"2026-11-02":"Seg 2 nov (fim de tarde e noite)","2026-11-03":"Ter 3 nov (dia inteiro)","2026-11-04":"Qua 4 nov (manhã e início da tarde)"};
var WIN={"2026-11-02":[17*60,24*60],"2026-11-03":[8*60,24*60],"2026-11-04":[8*60,15*60]};
var W={visual:.15,originality:.12,audienceFit:.10,partnershipLikelihood:.15,commercialValue:.10,fit3:.10,scheduleFit:.12,easeOfTravel:.05,contentPotential:.06,responseSpeedGuess:.05};

function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function arr(c){return S[c]||[]}
function nowIso(){return new Date().toISOString()}
function fmtTs(iso){if(!iso)return "—";var d=new Date(iso);if(isNaN(d))return esc(iso);return d.toLocaleString("pt-BR",{timeZone:TZ,day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",hour12:false}).replace(".","")}
function todayStr(){return new Date().toLocaleDateString("sv-SE",{timeZone:TZ})}
function eur(n){return n==null||n===""?"—":"€"+Number(n).toLocaleString("pt-BR")}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:""}
function lnk(u,t){u=safeUrl(u);return u?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(t||u)+'</a>':esc(t||"—")}
function toast(t,ms){var e=$("#toast");e.textContent=t;e.className="toast on";clearTimeout(toast._t);toast._t=setTimeout(function(){e.className="toast"},ms||4200)}
function tag(t,c){return '<span class="tag '+(c||"")+'">'+esc(t)+'</span>'}
function slug(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function addBiz(day,n){var d=new Date(day+"T12:00:00Z");while(n>0){d.setUTCDate(d.getUTCDate()+1);var w=d.getUTCDay();if(w!==0&&w!==6)n--}return d.toISOString().slice(0,10)}
function trunc(s,n){s=String(s||"");return s.length>n?s.slice(0,n-1)+"…":s}
function mins(t){var m=/^(\d{1,2}):(\d\d)$/.exec(t||"");return m?(+m[1])*60+(+m[2]):null}
/* ---- data ---- */
var ROLE={operator:"Operador",reseller:"Revendedor",agency:"Agência",pr:"Agência de PR",platform:"Plataforma"};
var ROLETAG={operator:"acc",reseller:"azul",agency:"gold",pr:"ok",platform:""};
function byCo(id){return arr("ph_companies").filter(function(c){return c._id===id})[0]}
function byExp(id){return arr("ph_experiences").filter(function(c){return c._id===id})[0]}
/* uma "oportunidade" = experiência x empresa. A visão mesclada reúne os campos da empresa, da experiência e da oportunidade para a interface. */
var _oc=null;
function companies(){if(_oc)return _oc;
  var cos={},exs={};arr("ph_companies").forEach(function(c){cos[c._id]=c});arr("ph_experiences").forEach(function(e){exs[e._id]=e});
  _oc=arr("ph_opps").map(function(o){var co=cos[o.companyId]||{},ex=exs[o.experienceId]||{};var photos=(ex.photos&&ex.photos.length)?ex.photos:(co.photos||[]);
    return Object.assign({},co,o,{_id:o._id,name:co.name||o.companyName||"?",companyId:o.companyId,experienceId:o.experienceId,role:o.role||"operator",co:co,ex:ex,expName:ex.name||"",
      experiences:ex.name?[{title:ex.name,description:ex.description,durationText:ex.durationText,priceEURPerPerson:ex.pricePPEUR,candidateSlot:ex.slotsCompat,slotNote:ex.availabilityNote}]:(co.experiences||[]),
      estValueEUR3:ex.price3EUR!=null?ex.price3EUR:co.estValueEUR3,photos:photos,category:ex.category||co.category,neighborhood:ex.neighborhood||co.neighborhood,
      whyItIsGood:o.whyItIsGood||ex.whyItIsGood||co.whyItIsGood||ex.description,scores:o.scores||co.scores||ex.scores,priority:o.priority||co.priority||ex.priority})});
  return _oc}
function byId(id){return companies().filter(function(c){return c._id===id})[0]}
function siblings(c){return companies().filter(function(o){return o.experienceId===c.experienceId&&o._id!==c._id})}
function meta(id){return arr("ph_meta").filter(function(x){return x._id===id})[0]||{}}
function contactsOf(id){return arr("ph_contacts").filter(function(x){return x.oppId===id}).sort(function(a,b){return String(a.ts).localeCompare(String(b.ts))})}
function score(c){var s=c.scores||{},t=0,w=0;for(var k in W){if(typeof s[k]==="number"){t+=s[k]*W[k];w+=W[k]}}return w?Math.round(t/w*10):null}
function msgOf(c){return c.msg||null}
function msgValid(c){var m=c.msg;if(!m||!m.approved)return false;var a=m.approved;return a.rev===m.rev&&a.to===m.to&&a.subject===m.subject&&a.body===m.body&&a.channel===m.channel}
function needsMe(c){if(c.flags&&c.flags.archived)return null;var m=c.msg;
  if(m&&m.status==="draft"){if(c.flags&&c.flags.postponedUntil&&c.flags.postponedUntil>todayStr())return null;return m.kind==="first"||!m.kind?"Aprovar mensagem":m.kind==="reply"?"Aprovar resposta":"Aprovar follow-up"}
  if(m&&m.status==="approved_manual")return "Enviar manualmente";
  if(c.stage==="aguardando_aprovacao")return "Decidir proposta";
  return null}
function igUrl(c){var i=c.instagram||{};if(safeUrl(i.url))return i.url;var h=String(i.handle||"").replace(/^@/,"");return h?"https://www.instagram.com/"+h+"/":""}
function blocksBase(c){var m=c.msg||{},b=[],v=c.verification||{};
  if(v.status==="red")b.push("Empresa marcada como suspeita.");
  if(v.aptApproach==="blocked")b.push("Dossiê marca a empresa como não apta para abordagem.");
  if(!m.body)b.push("Mensagem vazia.");
  if(m.channel==="email"&&!(m.to&&(c.emails||[]).some(function(e){return e.address===m.to})))b.push("Destinatário não está entre os e-mails verificados da ficha.");
  if(m.channel==="instagram"&&!igUrl(c))b.push("Instagram oficial não confirmado.");
  if(m.channel==="form"&&!c.contactForm)b.push("Formulário de contato não registrado.");
  var emo=(String(m.body||"").match(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu)||[]).length;if(emo>2)b.push("Mais de 2 emojis ("+emo+").");
  if((m.kind||"first")==="first"&&/disney|universal|warner|latam|air canada/i.test(String(m.body||"")+String(m.subject||"")))b.push("Cita marca de campanha anterior no primeiro contato.");
  if(c.stage==="recusada"||c.stage==="encerrada")b.push("Empresa já recusou ou foi encerrada.");
  return b}
function blocksOf(c){var b=blocksBase(c),m=c.msg||{};
  siblings(c).forEach(function(o){if(o.stage==="confirmada"||(o.msg&&o.msg.status==="sent"&&o.stage==="confirmada"))b.push("Outro caminho para esta experiência já confirmou ("+o.name+"). Suspenda novos contatos.")});
  if(m.channel==="email"&&m.to)companies().forEach(function(o){if(o._id!==c._id&&o.msg&&o.msg.to===m.to&&["approved_queued","sent","approved_manual"].indexOf(o.msg.status)>=0)b.push("O mesmo contato ("+m.to+") já recebeu ou tem mensagem aprovada em outra oportunidade.")});
  return b}
function vdot(c){var s=(c.verification||{}).status||"white";return '<span class="vd '+s+'"><i></i>'+VER[s]+'</span>'}
function firstSentOk(){return arr("ph_contacts").some(function(x){return x.status==="sent_confirmed"})}

/* ---- escrita ---- */
function put(col,id,data){if(!DB)return Promise.reject(new Error("sem banco"));return DB.collection(col).doc(id).set(data)}
function upd(col,id,data){if(!DB)return Promise.reject(new Error("sem banco"));data.updatedAt=nowIso();return DB.collection(col).doc(id).update(data)}
function logAct(summary,extra){var t=nowIso();var id="ev_"+t.replace(/[^0-9]/g,"")+"_"+Math.random().toString(36).slice(2,6);return put("ph_activity",id,Object.assign({ts:t,actor:"painel",summary:summary},extra||{}))}
function fail(e){toast("Não foi possível gravar. "+((e&&e.message)||"")+" Nada foi alterado.",6000)}
function routine(key){return ((meta("automations").routines)||[]).filter(function(r){return r.key===key})[0]}
function wake(key,text){var r=routine(key);if(!MCP||!r||!r.triggerId)return Promise.resolve("na");
  return MCP.callTool("Claude Code Remote","fire_trigger",{trigger_id:r.triggerId,text:text}).then(function(){return logAct("Painel acionou a rotina: "+r.name,{kind:"wake"})}).then(function(){return "ok"},function(){return "err"})}
function wakeMsg(r){return r==="ok"?"O agente foi acionado agora e registra o resultado aqui.":"Registrado na fila. O agente processa na próxima checagem agendada ou quando você acionar a rotina em Atividade."}

/* ---- ações ---- */
function approveMsg(c,silent){
  var b=blocksOf(c);if(b.length)return Promise.reject(new Error(b[0]));
  var m=c.msg,rev=m.rev,t=nowIso();
  var approved={rev:rev,channel:m.channel,to:m.to||null,subject:m.subject||null,body:m.body,at:t};
  if(m.channel==="email"){
    var cid="cmd_"+c._id+"_r"+rev+"_"+(m.kind||"first");
    var ex=arr("ph_commands").filter(function(x){return x._id===cid})[0];
    if(ex&&ex.status!=="failed"&&ex.status!=="cancelled")return Promise.reject(new Error("Já existe um comando para esta versão."));
    return upd("ph_opps",c._id,{msg:Object.assign({},m,{status:"approved_queued",approved:approved})})
      .then(function(){return put("ph_commands",cid,{action:"send_email",oppId:c._id,companyId:c.companyId,companyName:c.name,kind:m.kind||"first",rev:rev,content:{to:m.to,subject:m.subject,body:m.body},status:"queued",createdAt:t,createdBy:"painel"})})
      .then(function(){return logAct("Aprovou e-mail para "+c.name+" ("+m.to+"), versão "+rev,{oppId:c._id,companyId:c.companyId,kind:"approval"})});
  }
  return upd("ph_opps",c._id,{msg:Object.assign({},m,{status:"approved_manual",approved:approved})})
    .then(function(){return logAct("Aprovou mensagem manual ("+CH[m.channel]+") para "+c.name+", versão "+rev,{oppId:c._id,companyId:c.companyId,kind:"approval"})});
}
function doApprove(id){var c=byId(id);if(!c)return;
  if(!confirmed(c)){toast("Marque a caixa de leitura na gaveta antes de aprovar.");return}
  approveMsg(c).then(function(){return c.msg.channel==="email"?wake("queue","MODO FILA (acionado pelo painel Paris Hub): processe SOMENTE os comandos de ph_commands com status queued e action send_email, em ordem de createdAt. Sem pesquisa.").then(function(r){toast("Aprovado. "+wakeMsg(r),7000)}):toast("Aprovado. Envie manualmente e marque como enviada.")},fail)}
function confirmed(){return true}
function setFlag(id,flags,summary){var c=byId(id);if(!c)return;upd("ph_opps",id,{flags:Object.assign({},c.flags||{},flags)}).then(function(){return logAct(summary+": "+c.name,{oppId:id,companyId:(byId(id)||{}).companyId,kind:"flag"})}).then(function(){toast("Atualizado.")},fail)}
function reject(id){var c=byId(id);if(!c)return;upd("ph_opps",id,{stage:"encerrada",msg:Object.assign({},c.msg||{},{status:"discarded"}),flags:Object.assign({},c.flags||{},{rejectedByMe:true})}).then(function(){return logAct("Rejeitou a abordagem a "+c.name,{oppId:id,companyId:(byId(id)||{}).companyId,kind:"reject"})}).then(function(){closeSheet();toast("Rejeitada.")},fail)}
function postpone(id){var c=byId(id);setFlag(id,{postponedUntil:addBiz(todayStr(),1)},"Adiou até amanhã")}
function markSent(id){var c=byId(id),m=c&&c.msg;if(!m)return;var t=nowIso(),cid="ct_"+id+"_r"+m.rev+"_"+(m.kind||"first");
  var n=(m.kind==="followup1"||m.kind==="followup")?1:m.kind==="followup2"?2:0;
  put("ph_contacts",cid,{oppId:id,companyId:(byId(id)||{}).companyId,companyName:c.name,channel:m.channel,type:"outbound",direction:"out",status:"sent_manual_confirmed_by_user",ts:t,sentAt:t,kind:m.kind||"first",content:{to:m.to||null,subject:m.subject||null,text:m.body},rev:m.rev})
   .then(function(){var due=addBiz(todayStr(),2);return upd("ph_opps",id,{stage:n?"followup":"aguardando",msg:Object.assign({},m,{status:"sent",sentAt:t}),followUp:{due:due,n:n+1,status:n>=2?"closed":"pending"},outreach:{state:"sent",channel:m.channel,sentAt:t,by:"user"}})})
   .then(function(){return logAct("Marcou como enviada ("+CH[m.channel]+"): "+c.name,{oppId:id,companyId:(byId(id)||{}).companyId,kind:"sent"})}).then(function(){closeSheet();toast("Registrado como enviada por você.")},fail)}
function decide(id,decision,note){var c=byId(id);if(!c)return;var neg=c.negotiation||{};var t=nowIso();var cid="cmd_"+id+"_dec_"+t.replace(/[^0-9]/g,"");
  var snap={offer:neg.offer||null,evaluation:neg.evaluation||null,recommendation:neg.recommendation||null,updatedAt:neg.updatedAt||null};
  put("ph_commands",cid,{action:"decision",decision:decision,oppId:id,companyId:(byId(id)||{}).companyId,companyName:c.name,note:note||"",visibleTerms:snap,status:"queued",createdAt:t,createdBy:"painel"})
   .then(function(){var patch={negotiation:Object.assign({},neg,{userDecision:{decision:decision,at:t,note:note||""}})};if(decision==="reject")patch.stage="recusada";if(decision==="archive")patch.stage="encerrada";if(decision==="approve_offer")patch.stage="aprovada";if(decision==="priority")patch.flags=Object.assign({},c.flags||{},{priority:!(c.flags&&c.flags.priority)});return upd("ph_opps",id,patch)})
   .then(function(){return logAct("Decisão registrada ("+decision+") para "+c.name,{oppId:id,companyId:(byId(id)||{}).companyId,kind:"decision"})})
   .then(function(){if(decision==="priority"||decision==="archive"||decision==="reject")return "na";return wake("replies","MODO DECISÃO (acionado pelo painel Paris Hub): processe SOMENTE os comandos de ph_commands com status queued e action decision. Aprovar condições = só registrar e preparar rascunho de resposta para aprovação; nunca enviar nem confirmar reserva.")})
   .then(function(r){closeSheet();toast("Decisão registrada. "+(r==="na"?"":wakeMsg(r)),7000)},fail)}

function msgBox(c,m){if(!m)return '<div class="note warn">Sem mensagem preparada.</div>';
  return '<div class="msg"><div class="hd">'+esc(CH[m.channel]||m.channel)+' · '+esc((m.language||"").toUpperCase())+' · versão '+esc(m.rev)+' · texto exato do envio</div>'+(m.to?'<div class="mono" style="margin-top:6px">Para: '+esc(m.to)+'</div>':'')+(m.subject?'<div style="margin-top:4px"><b>'+esc(m.subject)+'</b></div>':'')+'<pre>'+esc(m.body)+'</pre></div>'+
  '<div class="msg pt"><div class="hd">Tradução para conferência (não vai na mensagem)</div><pre>'+esc(m.bodyPt||"Sem tradução registrada.")+'</pre></div>'}

function manualBox(c){var m=c.msg,url=m.channel==="instagram"?igUrl(c):c.contactForm;
  return '<div class="int" style="margin-top:10px"><b>Envio manual.</b> O sistema não envia DMs nem formulários. Copie, abra o canal, envie você mesma e depois marque como enviada.<div class="btns" style="margin-top:8px"><button class="btn" data-a="copy" data-id="'+esc(c._id)+'" type="button">Copiar texto</button>'+(safeUrl(url)?'<a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Abrir canal</a>':'')+'<button class="btn pri" data-a="sent" data-id="'+esc(c._id)+'" type="button">Marquei como enviada</button></div></div>'}
function negBlock(c){var n=c.negotiation||{},o=n.offer||{},m=c.msg;
  var fields=[["Resposta",n.summary],["Benefício oferecido",o.benefit],["Pessoas incluídas",o.people!=null?o.people:null],["Data",o.date],["Horário",o.time],["Contrapartida pedida",o.deliverables],["Cachê",o.cachet],["Custos adicionais",o.costs],["Direitos de uso",o.rights],["Valor estimado",o.valueEUR!=null?eur(o.valueEUR):null],["Prazo de resposta",n.deadline]];
  var ud=n.userDecision;
  return '<section><p class="sec">Negociação'+(ud?' · sua decisão: '+esc(ud.decision)+' em '+fmtTs(ud.at):'')+'</p><dl class="facts">'+fields.map(function(r){return '<div><dt>'+r[0]+'</dt><dd>'+(r[1]==null||r[1]===""?'<span class="mut">não informado</span>':esc(r[1]))+'</dd></div>'}).join("")+'</dl>'+
   (n.evaluation?'<div class="note" style="margin-top:10px"><b>Avaliação:</b> '+esc(n.evaluation)+'</div>':'')+(n.recommendation?'<div class="note warn" style="margin-top:8px"><b>Recomendação:</b> '+esc(n.recommendation)+'</div>':'')+
   '<p class="small mut" style="margin-top:8px">Sua decisão vale somente para as condições acima. Condições novas ou diferentes exigem nova decisão.</p>'+
   '<div class="btns"><button class="btn ok" data-a="dec" data-d="approve_offer" data-id="'+esc(c._id)+'" type="button">Aprovar estas condições</button><button class="btn" data-a="dec" data-d="renegotiate" data-id="'+esc(c._id)+'" type="button">Pedir renegociação</button><button class="btn" data-a="dec" data-d="more_info" data-id="'+esc(c._id)+'" type="button">Pedir mais informações</button><button class="btn bad" data-a="dec" data-d="reject" data-id="'+esc(c._id)+'" type="button">Recusar</button></div></section>'}
function editSheet(id){var c=byId(id),m=c&&c.msg;if(!m)return;
  var opts=(c.emails||[]).map(function(e){return '<option value="'+esc(e.address)+'"'+(e.address===m.to?' selected':'')+'>'+esc(e.address)+' ('+esc(e.role||"")+')</option>'}).join("");

    '<div class="small mut" style="margin-top:4px">'+esc(x.e.name||"")+'</div>'+
    '<details style="margin-top:8px"><summary class="small" style="cursor:pointer;font-weight:700">Ver texto</summary><pre style="white-space:pre-wrap;margin:6px 0 0">'+esc(m.body)+'</pre></details>'+
    '<div class="btns" style="margin-top:10px"><button class="btn" data-a="copy" data-id="'+esc(c._id)+'" type="button">Copiar texto</button>'+(safeUrl(url)?'<a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Abrir '+(m.channel==="instagram"?'perfil':'formulário')+'</a>':'<span class="small mut">sem link oficial visto</span>')+'<button class="btn pri" data-a="sent" data-id="'+esc(c._id)+'" type="button">Marquei como enviada</button></div></div>'}).join("")+'</div>'}

  claude.use("db").then(function(db){DB=db;if(!db){setLive(false,"sem banco");render();return}
    var PEND={},TMR={};COLS.forEach(function(c){db.collection(c).onSnapshot(function(snap){PEND[c]=snap;clearTimeout(TMR[c]);TMR[c]=setTimeout(function(){var sn=PEND[c];S[c]=sn.docs.map(function(d){return Object.assign({_id:d.id},d.data())});_oc=null;LOADED[c]=1;setLive(true,"ao vivo");if($("#sheet").hidden||c!=="ph_companies")render()},IMPORTING?1500:0)},function(){setLive(false,"erro de leitura")})});
    render()},function(){setLive(false,"sem banco");render()});
